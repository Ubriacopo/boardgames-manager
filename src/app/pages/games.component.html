<main class="mx-auto min-h-[calc(100dvh-64px)] max-w-[1500px] px-5 py-8 pb-28 lg:min-h-[calc(100dvh-76px)] lg:px-16 lg:py-12">
    <header class="mb-3">
        <p class="mb-3 text-xs font-bold tracking-[.14em] text-accent uppercase">Discover</p>
    </header>

    <section class="sticky top-0 z-10 mb-7 grid gap-4 bg-canvas/95 py-3 backdrop-blur">
        <div class="flex flex-col gap-3 sm:flex-row">
            <label class="flex flex-1 items-center gap-2 rounded-xl border border-line bg-surface px-4 focus-within:border-brand">
                <mat-icon>search</mat-icon>
                <input class="w-full bg-transparent py-3 outline-none" type="search" [ngModel]="query()" (ngModelChange)="setQuery($event)"
                       placeholder="Search every board game">
            </label>
            <select class="rounded-xl border border-line bg-surface px-4 py-3" [ngModel]="sort()" (ngModelChange)="sort.set($event)">
                <option value="rank">Best ranked</option>
                <option value="rating">Highest rating</option>
                <option value="popular">Most popular</option>
                <option value="newest">Newest</option>
            </select>
        </div>
        <div class="flex gap-2 overflow-x-auto pb-1">
            @for (item of categories; track item) {
                <button mat-stroked-button type="button" class="shrink-0"
                        [class.!bg-accent]="category() === item"
                        [class.!text-white]="category() === item"
                        (click)="category.set(item)">
                    {{ item }}
                </button>
            }
        </div>
    </section>

    @if (loading()) {
        <p class="py-20 text-center text-muted">Opening the catalog…</p>
    } @else if (error()) {
        <p class="py-20 text-center text-[#a53525]">{{ error() }}</p>
    } @else {
        <div class="mb-4 flex items-center justify-between">
            <p class="m-0 text-sm text-muted">Showing the first {{ results().length }} matches</p>
        </div>
        <section class="divide-y divide-line">
            @for (game of results(); track game.bggId) {
                <app-game-list-row
                        [name]="game.name"
                        [imageUrl]="covers.urls()[game.bggId] ?? null"
                        [year]="game.yearPublished"
                        [category]="game.themes[0] || ''"
                        [rank]="game.rank"
                        [rating]="game.avgRating"
                        [link]="['/games/discover', game.bggId]"
                        [addActions]="true"
                        [adding]="adding()[game.bggId]"
                        (defaultAdd)="add(game)"
                        (specialAdd)="add(game, true)"
                />
            } @empty {
                <p class="col-span-full py-20 text-center text-muted">No games match these filters.</p>
            }
        </section>
    }
</main>
