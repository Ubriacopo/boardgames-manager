<section class="recent-section">
    <header>
        <div>
            <p class="eyebrow">The collection</p>
            <h2>All your games</h2>
        </div>
        <span class="rounded-full bg-mint px-4 py-2 text-sm text-brand">{{ filtered().length }} games</span>
    </header>

    <div class="mb-5 flex flex-col gap-3 sm:flex-row">
        <label class="flex flex-1 items-center gap-2 rounded-xl border border-line bg-surface px-4">
            <mat-icon>search</mat-icon>
            <input class="w-full bg-transparent py-3 outline-none" type="search" [(ngModel)]="query"
                   placeholder="Search my collection">
        </label>
        <select class="rounded-xl border border-line bg-surface px-4" [(ngModel)]="sort">
            <option value="name">A–Z</option>
            <option value="rating">Top rated</option>
            <option value="newest">Newest</option>
        </select>
    </div>

    <div class="recent-game-list">
        @for (game of filtered(); track game.id) {
            <app-game-list-row
              [name]="game.name"
              [year]="game.release_year"
              [imageUrl]="game.image_url"
              [category]="library.metadata()[game.id]?.themes?.[0] ?? ''"
              [location]="location(game.box)"
              [rating]="library.metadata()[game.id]?.avgRating ?? null"
              [favorite]="game.favorite"
              [link]="['/games', game.id]"
              [draggable]="true"
              [swipeDirection]="swipeDirection[game.id]"
              (dragMoved)="trackSwipe(game.id, $event)"
              (dragEnded)="finishSwipe(game, $event)"
            />
        } @empty {
            <p class="py-16 text-center text-muted">No games match this search.</p>
        }
    </div>
</section>
