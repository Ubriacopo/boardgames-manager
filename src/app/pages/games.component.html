<main class="mx-auto min-h-[calc(100dvh-76px)] max-w-[1680px] px-5 py-10 pb-28 lg:px-16 lg:py-14">
  <header class="mb-11 flex flex-col items-start justify-between gap-7 sm:flex-row sm:items-end">
    <div>
      <p class="mb-3 text-xs font-bold tracking-[.14em] text-accent uppercase">The collection</p>
      <h1 class="mb-3 font-display text-5xl font-bold tracking-tight lg:text-7xl">Browse all games</h1>
      <p class="text-muted">Every game on your shelf, ready to rediscover.</p>
    </div>
    <div class="flex items-center gap-2.5 rounded-2xl bg-mint px-5 py-3 text-brand"><strong class="font-display text-3xl">{{ filtered().length }}</strong><span class="max-w-12 text-xs text-muted">games found</span></div>
  </header>
  <div class="mb-8 flex flex-col gap-3 sm:flex-row">
    <label class="flex flex-1 items-center gap-2.5 rounded-xl border border-line bg-surface px-4 focus-within:border-brand">
      <mat-icon>search</mat-icon>
      <input class="w-full bg-transparent py-4 outline-none" type="search" [(ngModel)]="query" placeholder="Search title, year, or category">
    </label>
    <select class="min-w-40 rounded-xl border border-line bg-surface px-4 text-ink" [(ngModel)]="sort">
      <option value="name">A–Z</option>
      <option value="rating">Top rated</option>
      <option value="newest">Newest</option>
    </select>
  </div>
  @if (filtered().length) {
    <section class="grid grid-cols-2 gap-3 md:gap-6 lg:grid-cols-4">
      @for (game of filtered(); track game.id) {
        <app-game-card
          [game]="game"
          [metadata]="library.metadata()[game.id]"
          [location]="location(game.box)"
          />
      }
    </section>
  } @else {
    <section class="flex min-h-85 flex-col items-center justify-center text-center">
      <mat-icon class="!size-12 !text-5xl text-accent">search_off</mat-icon>
      <h2 class="font-display text-3xl">No games found</h2>
      <p class="text-muted">Try a shorter title or another category.</p>
    </section>
  }
</main>
