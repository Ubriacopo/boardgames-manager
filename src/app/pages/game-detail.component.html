@if (library.game(gameId); as game) {
    <app-game-detail-view
            [bggId]="game.bgg_id ?? 0"
            [name]="game.name"
            [releaseYear]="game.release_year"
            [imageUrl]="game.image_url"
            [metadata]="library.metadata()[game.id]"
            [owned]="true"
            [gameDefinitionId]="game.game_id"
            [selectedSizeId]="game.game_box_size_id"
            [customDimensions]="customDimensions(game)"
            [savingDimensions]="savingDimensions()"
            [dimensionsError]="dimensionsError()"
            [location]="location(game.box)"
            [bggUrl]="game.bgg_url"
            backLabel="My collection"
            actionLabel="Add another copy"
            [actionDisabled]="addingCopy()"
            (primaryAction)="addCopy()"
            (specialAction)="addCopy(true)"
            [error]="addError()"
            (back)="back()"
            (boxSizeSave)="saveBoxSize($event)"
    />
} @else {
    <main class="flex min-h-[calc(100dvh-76px)] flex-col items-center justify-center px-5 text-center">
        <mat-icon class="!size-12 !text-5xl text-accent">extension_off</mat-icon>
        <h1 class="font-display text-5xl">Game not found</h1>
    </main>
}
